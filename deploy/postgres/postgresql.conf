# Identical for temporal-db, dbos-db, cbs-db and app-db (fairness rule 3).
listen_addresses = '*'
max_connections = 300
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB
# Durability is never relaxed for either engine.
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9
wal_buffers = 16MB
bgwriter_delay = 100ms
autovacuum = on
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
track_io_timing = on
log_min_duration_statement = -1
